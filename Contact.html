<!DOCTYPE html>
<html>
<head>
  <title>Contact Me</title>

  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<header>
  <h2>Contact Me</h2>
</header>

<nav>
  <div>My Site</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="skills.html">Skills</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<main>

<form action="#" method="post">

  <fieldset>
    <legend>Info</legend>

    <label for="n">Name:</label>
    <input type="text" id="n" name="n" required maxlength="50">

    <label for="e">Email:</label>
    <input type="email" id="e" name="e" required>

    <label for="p">Phone:</label>
    <input type="tel" id="p" name="p" required>

    <label for="a">Age:</label>
    <input type="number" id="a" name="a" min="1" max="100" required>

    <label for="d">Date:</label>
    <input type="date" id="d" name="d" required>

  </fieldset>

  <fieldset>
    <legend>Details</legend>

    <label for="s">Subject:</label>
    <select id="s" name="s" required>
      <optgroup label="General">
        <option>Question</option>
        <option>Feedback</option>
      </optgroup>
      <optgroup label="Other">
        <option>Support</option>
        <option>Others</option>
      </optgroup>
    </select>

    <p>Contact:</p>
    <input type="radio" id="r1" name="c" required>
    <label for="r1">Email</label>

    <input type="radio" id="r2" name="c">
    <label for="r2">Phone</label>

    <input type="radio" id="r3" name="c">
    <label for="r3">Any</label>

    <p>Options:</p>
    <input type="checkbox" id="c1" name="o">
    <label for="c1">Option 1</label>

    <input type="checkbox" id="c2" name="o">
    <label for="c2">Option 2</label>

    <input type="checkbox" id="c3" name="o">
    <label for="c3">Option 3</label>

    <label for="r">Range:</label>
    <input type="range" id="r" name="r" min="0" max="10">

    <label for="m">Message:</label>
    <textarea id="m" name="m" required maxlength="200"></textarea>

  </fieldset>

  <input type="submit" value="Send">

</form>

</main>

<footer>
  <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
