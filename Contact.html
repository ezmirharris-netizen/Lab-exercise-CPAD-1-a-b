<h3>Contact Me</h3>

<form action="#" method="post">

<fieldset>
<legend>Info</legend>

<label for="n">Name:</label>
<input type="text" id="n" name="n" required maxlength="50"><br><br>

<label for="e">Email:</label>
<input type="email" id="e" name="e"><br><br>

<label for="p">Phone:</label>
<input type="tel" id="p" name="p"><br><br>

<label for="a">Age:</label>
<input type="number" id="a" name="a" min="1" max="100"><br><br>

<label for="d">Date:</label>
<input type="date" id="d" name="d"><br><br>

</fieldset>

<fieldset>
<legend>Details</legend>

<label for="s">Subject:</label>
<select id="s" name="s">
<optgroup label="General">
<option>Software Engineering</option>
<option>Data Engineering</option>
</optgroup>
<optgroup label="Other">
<option>Graphic Multimedia</option>
<option>Bioinformatics</option>
</optgroup>
</select><br><br>

<label>Contact:</label>
<input type="radio" id="r1" name="c" required><label for="r1">Email</label>
<input type="radio" id="r2" name="c"><label for="r2">Phone</label>
<input type="radio" id="r3" name="c"><label for="r3">Any</label><br><br>

<label>Race:</label>
<input type="checkbox" id="c1" name="o"><label for="c1">Malay</label>
<input type="checkbox" id="c2" name="o"><label for="c2">Indian</label>
<input type="checkbox" id="c3" name="o"><label for="c3">Chinese</label><br><br>

<label for="r">Rating:</label>
<input type="range" id="r" name="r" min="0" max="10"><br><br>

<label for="m">Short Description:</label>
<textarea id="m" name="m" required maxlength="200"></textarea><br><br>

</fieldset>

<input type="submit" value="Send">

</form>

</body>
